name: flutter_legado
description: "Legado - A reading app powered by Rust + Flutter"
publish_to: 'none'
version: 2.0.400+401

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffi: ^2.1.0
  file_picker: ^8.0.0
  flutter_rust_bridge: 2.11.1
  freezed_annotation: ^2.0.0
  json_annotation: ^4.0.0
  shared_preferences: ^2.0.0
  http: ^1.2.0
  path_provider: ^2.0.0
  share_plus: ^10.0.0
  url_launcher: ^6.2.0
  video_player: ^2.9.3
  webview_flutter: ^4.10.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.0
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  # [PARITY A1] 图库二维码解码：参考版扫码页右上图库按钮，选中图片后本地
  # 解码 QR（zxing2 纯 Dart 解码器 + image 解图），不依赖相机即可导入
  zxing2: ^0.2.4
  image: ^4.8.0
  saf: ^2.1.0
  archive: ^4.0.9
  package_info_plus: ^9.0.0
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.0
  material_symbols_icons: ^4.2960.0
  # [批21e] RSS HTML 模式脚本剥离改用 HTML5 DOM 解析（与浏览器同容忍语义，
  # 替代手写词法扫描）；pubspec.lock 中已有 0.15.6 传递依赖
  html: ^0.15.4
  # [批22 P3] 远程导入临时落盘目录以 SHA-1(origin) 稳定哈希隔离，
  # 解决不同服务器/目录同名文件合并为同一书架条目；lock 中已有
  # 3.0.7 传递依赖，此处转为直接依赖
  crypto: ^3.0.0

  # ── [iOS 轨 P2] 原生功能补齐（Android 走既有 Kotlin 桥，不回归）──
  flutter_tts: ^4.2.0
  device_info_plus: ^11.0.0
  screen_brightness: ^2.0.0
  flutter_local_notifications: ^18.0.0
  app_links: ^6.0.0
  palette_generator: ^0.3.3+7
  dynamic_color: ^2.1.0
  material_color_utilities: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.0.0
  freezed: ^2.0.0
  json_serializable: ^6.0.0
  mocktail: ^1.0.0
  # [批21e] 看门狗用例使用可控虚拟时钟（避免墙钟抖动）
  fake_async: ^1.3.1
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.0
  riverpod_lint: ^2.3.0
  # codegen 通过 cargo install flutter_rust_bridge_codegen 安装
  # 运行: flutter_rust_bridge_codegen generate

flutter:
  uses-material-design: true
  assets:
    # 默认书籍封面（对标 Android res/drawable/image_cover_default.jpg）
    - assets/images/
    # 默认数据（对标 Android assets/defaultData）
    - assets/default_data/
    # Mock 书架样例（USE_MOCK 数据源，合成脱敏；口径见 assets/mock_data/README.md）
    - assets/mock_data/
    # 帮助文档（对标 Android assets/web/help/md + storageHelp.md）
    - assets/web/help/md/
    - assets/storageHelp.md
    # About 页（对标 Android assets/updateLog.md + disclaimer.md）
    - assets/updateLog.md
    - assets/disclaimer.md
