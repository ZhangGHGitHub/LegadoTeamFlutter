name: flutter_legado
description: "Legado - A reading app powered by Rust + Flutter"
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffi: ^2.1.0
  file_picker: ^8.0.0
  flutter_rust_bridge: 2.11.1
  freezed_annotation: ^2.0.0
  json_annotation: ^4.0.0
  provider: ^6.0.0
  shared_preferences: ^2.0.0
  http: ^1.2.0
  path_provider: ^2.0.0
  share_plus: ^10.0.0
  url_launcher: ^6.2.0
  video_player: ^2.9.3
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.0.0
  freezed: ^2.0.0
  json_serializable: ^6.0.0
  # codegen 通过 cargo install flutter_rust_bridge_codegen 安装
  # 运行: flutter_rust_bridge_codegen generate

flutter:
  uses-material-design: true
