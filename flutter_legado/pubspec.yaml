name: flutter_legado
description: "Legado - A reading app powered by Rust + Flutter"
publish_to: 'none'
version: 2.0.62+64

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffi: ^2.1.0
  file_picker: ^8.0.0
  flutter_rust_bridge: 2.11.1
  freezed_annotation: ^2.0.0
  json_annotation: ^4.0.0
  shared_preferences: ^2.0.0
  http: ^1.2.0
  path_provider: ^2.0.0
  share_plus: ^10.0.0
  url_launcher: ^6.2.0
  video_player: ^2.9.3
  webview_flutter: ^4.10.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.0
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  saf: ^2.1.0
  archive: ^4.0.9
  package_info_plus: ^9.0.0
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.0.0
  freezed: ^2.0.0
  json_serializable: ^6.0.0
  mocktail: ^1.0.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.0
  riverpod_lint: ^2.3.0
  # codegen 通过 cargo install flutter_rust_bridge_codegen 安装
  # 运行: flutter_rust_bridge_codegen generate

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    # 默认数据（对标 Android assets/defaultData）
    - assets/default_data/
    # 帮助文档（对标 Android assets/web/help/md + storageHelp.md）
    - assets/web/help/md/
    - assets/storageHelp.md
    # About 页（对标 Android assets/updateLog.md + disclaimer.md）
    - assets/updateLog.md
    - assets/disclaimer.md
