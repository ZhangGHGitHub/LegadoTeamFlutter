<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844"><style>:root{--r:#0F1416;--t:#DFE3E6;--m:#C0C8CC;--c:#1B2225;--p:#6FD1FF}text{font-family:Georgia,'Noto Serif SC',serif;fill:var(--t)}.m{fill:var(--m)}</style><rect width="390" height="844" fill="var(--r)"/><text x="18" y="22" font-family="Arial" font-size="12" class="m">23:18</text><text x="20" y="64" font-size="14" class="m">诡秘之主 · 夜间模式</text><text x="20" y="120" font-size="24" font-weight="700">第一章 灰雾之上</text><text x="20" y="168" font-size="18">克莱恩·莫雷蒂做了一个梦。</text><text x="20" y="204" font-size="18">梦里是一片无边无际的灰雾，</text><text x="20" y="240" font-size="18">古老的宫殿静静矗立在雾海之上。</text><text x="20" y="276" font-size="18">他看见青铜长桌，和十二把高背椅。</text><text x="20" y="312" font-size="18">命运的齿轮从此开始转动。</text><rect x="20" y="704" width="350" height="4" rx="2" fill="#40484C"/><rect x="20" y="704" width="112" height="4" rx="2" fill="var(--p)"/><text x="20" y="744" font-size="14" class="m">‹ 上一章</text><text x="170" y="744" font-size="13" class="m">12%</text><text x="302" y="744" font-size="14" class="m">下一章 ›</text><rect x="20" y="776" width="350" height="48" rx="24" fill="var(--c)"/><text x="84" y="806" font-size="13" class="m">Aa  字体</text><text x="181" y="806" font-size="13" class="m">目录</text><text x="276" y="806" font-size="13" class="m">书签</text></svg>
