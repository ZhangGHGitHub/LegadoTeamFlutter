<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844"><style>:root{--reader:#17191c;--onReader:#e5e7eb;--onReaderVar:#9aa1aa;--surfaceContainer:#24282d}text{font-family:Georgia,'Noto Serif SC',serif;fill:var(--onReader)}.muted{fill:var(--onReaderVar)}</style><rect width="390" height="844" fill="var(--reader)"/><text x="18" y="23" font-family="Arial" font-size="12" class="muted">23:18</text><text x="20" y="64" font-size="14" class="muted">诡秘之主</text><text x="20" y="120" font-size="24" font-weight="700">第一章 灰雾之上</text><text x="20" y="168" font-size="18">克莱恩·莫雷蒂做了一个梦。</text><text x="20" y="204" font-size="18">梦里是一片无边无际的灰雾，</text><text x="20" y="240" font-size="18">古老的宫殿静静矗立在雾海之上。</text><text x="20" y="276" font-size="18">他看见青铜长桌，和十二把高背椅。</text><text x="20" y="312" font-size="18">命运的齿轮从此开始转动。</text><rect x="18" y="720" width="354" height="56" rx="28" fill="var(--surfaceContainer)"/><text x="42" y="754" font-size="14" class="muted">‹ 上一章</text><text x="165" y="754" font-size="13" class="muted">12%</text><text x="300" y="754" font-size="14" class="muted">下一章 ›</text><text x="20" y="818" font-family="Arial" font-size="12" class="muted">点击屏幕中央打开阅读菜单</text></svg>
