<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legado 阅读器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f5f5;--card:#fff;--primary:#1a73e8;--text:#333;--muted:#888;--border:#e0e0e0;--shadow:0 2px 8px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--primary);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
header h1{font-size:18px;font-weight:600}
nav{display:flex;gap:8px}
nav button{background:rgba(255,255,255,.15);color:#fff;border:none;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:14px}
nav button.active,nav button:hover{background:rgba(255,255,255,.3)}
.container{max-width:1100px;margin:0 auto;padding:16px}
/* 书架网格 */
.bookshelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.book-card{background:var(--card);border-radius:8px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.book-card:hover{transform:translateY(-3px)}
.book-cover{width:100%;aspect-ratio:3/4;background:#ddd;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:48px}
.book-cover img{width:100%;height:100%;object-fit:cover}
.book-info{padding:10px}
.book-info h3{font-size:14px;line-height:1.4;margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.book-info p{font-size:12px;color:var(--muted)}
/* 章节列表 */
.chapter-list{background:var(--card);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.chapter-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.chapter-item:hover{background:#f0f7ff}
.chapter-item:last-child{border-bottom:none}
.back-btn{background:var(--card);border:1px solid var(--border);padding:8px 16px;border-radius:6px;cursor:pointer;margin-bottom:12px;font-size:14px}
.back-btn:hover{background:#eee}
/* 阅读视图 */
.reader{background:var(--card);border-radius:8px;box-shadow:var(--shadow);padding:24px;line-height:1.9;font-size:16px;max-width:700px;margin:0 auto}
.reader h2{text-align:center;margin-bottom:20px;font-size:20px}
.reader .content{white-space:pre-wrap;text-indent:2em}
.reader-nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px;max-width:700px;margin-left:auto;margin-right:auto}
.reader-nav button{flex:1;padding:10px;border:1px solid var(--border);background:var(--card);border-radius:6px;cursor:pointer;font-size:14px}
.reader-nav button:hover:not(:disabled){background:#eee}
.reader-nav button:disabled{opacity:.4;cursor:default}
/* 搜索 */
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-bar input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:6px;font-size:14px;outline:none}
.search-bar input:focus{border-color:var(--primary)}
.search-bar button{padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px}
.search-result{background:var(--card);border-radius:8px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;cursor:pointer}
.search-result:hover{background:#f8f8f8}
.search-result h4{font-size:15px;margin-bottom:4px}
.search-result p{font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:48px;color:var(--muted);font-size:15px}
.loading{text-align:center;padding:24px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Legado</h1>
  <nav>
    <button id="nav-bookshelf" class="active" onclick="showView('bookshelf')">书架</button>
    <button id="nav-search" onclick="showView('search')">搜索</button>
  </nav>
</header>
<div class="container" id="app"></div>

<script>
const app = document.getElementById('app');
const API = '/api';
let currentView = 'bookshelf';
let readerState = null;

function showView(v) {
  currentView = v;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + v)?.classList.add('active');
  if (v === 'bookshelf') loadBookshelf();
  else if (v === 'search') renderSearch();
}

async function api(path, opts) {
  const r = await fetch(API + path, opts);
  return r.json();
}

// ── 书架 ──
async function loadBookshelf() {
  app.innerHTML = '<div class="loading">加载中…</div>';
  try {
    const data = await api('/books');
    const books = data.books || [];
    if (!books.length) { app.innerHTML = '<div class="empty">书架为空，去搜索添加书籍吧</div>'; return; }
    app.innerHTML = '<div class="bookshelf">' + books.map(b => `
      <div class="book-card" onclick="openBook('${esc(b.book_url)}','${esc(b.name)}')">
        <div class="book-cover">${b.cover_url ? `<img src="${esc(b.cover_url)}" onerror="this.parentNode.innerHTML='📖'">` : '📖'}</div>
        <div class="book-info"><h3>${esc(b.name)}</h3><p>${esc(b.author||'未知作者')}</p></div>
      </div>`).join('') + '</div>';
  } catch(e) { app.innerHTML = '<div class="empty">加载失败: ' + e.message + '</div>'; }
}

// ── 阅读 ──
async function openBook(bookUrl, name) {
  app.innerHTML = '<div class="loading">加载章节列表…</div>';
  try {
    const data = await api('/books/' + encodeURIComponent(bookUrl) + '/chapters');
    const chapters = data.chapters || [];
    if (!chapters.length) { app.innerHTML = '<button class="back-btn" onclick="showView(\'bookshelf\')">← 返回</button><div class="empty">暂无章节</div>'; return; }
    readerState = { bookUrl, name, chapters };
    app.innerHTML = `<button class="back-btn" onclick="showView('bookshelf')">← 返回书架</button>
      <h2 style="margin-bottom:12px;font-size:18px">${esc(name)}</h2>
      <div class="chapter-list">${chapters.map((c,i) => `
        <div class="chapter-item" onclick="readChapter(${i})">
          <span>${esc(c.title||'第'+(i+1)+'章')}</span>
          <span style="color:var(--muted);font-size:12px">${c.is_volume?'[卷]':''}</span>
        </div>`).join('')}</div>`;
  } catch(e) { app.innerHTML = '<button class="back-btn" onclick="showView(\'bookshelf\')">← 返回</button><div class="empty">加载失败: ' + e.message + '</div>'; }
}

async function readChapter(index) {
  const { bookUrl, name, chapters } = readerState;
  app.innerHTML = '<div class="loading">加载章节内容…</div>';
  try {
    const data = await api('/books/' + encodeURIComponent(bookUrl) + '/chapters/' + index + '/content');
    const title = chapters[index]?.title || ('第' + (index+1) + '章');
    let content = '';
    if (typeof data === 'string') {
      content = data;
    } else if (data.content) {
      content = data.content;
    } else if (data.chapter_url) {
      content = '章节需要在线获取: ' + data.chapter_url;
    } else {
      content = JSON.stringify(data, null, 2);
    }
    app.innerHTML = `<button class="back-btn" onclick="openBook('${esc(bookUrl)}','${esc(name)}')">← 章节列表</button>
      <div class="reader"><h2>${esc(title)}</h2><div class="content">${esc(content)}</div></div>
      <div class="reader-nav">
        <button ${index===0?'disabled':''} onclick="readChapter(${index-1})">上一章</button>
        <button onclick="openBook('${esc(bookUrl)}','${esc(name)}')">目录</button>
        <button ${index>=chapters.length-1?'disabled':''} onclick="readChapter(${index+1})">下一章</button>
      </div>`;
    window.scrollTo(0, 0);
  } catch(e) { app.innerHTML = '<button class="back-btn" onclick="openBook(\''+esc(bookUrl)+'\',\''+esc(name)+'\')">← 返回</button><div class="empty">加载失败: ' + e.message + '</div>'; }
}

// ── 搜索 ──
function renderSearch() {
  app.innerHTML = `<div class="search-bar">
    <input id="search-input" placeholder="搜索书名或作者…" onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">搜索</button>
  </div><div id="search-results"></div>`;
  document.getElementById('search-input')?.focus();
}

async function doSearch() {
  const kw = document.getElementById('search-input')?.value?.trim();
  if (!kw) return;
  const el = document.getElementById('search-results');
  el.innerHTML = '<div class="loading">搜索中…</div>';
  try {
    const data = await api('/search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ keyword: kw })
    });
    const results = data.results || [];
    if (!results.length) { el.innerHTML = '<div class="empty">未找到相关书籍</div>'; return; }
    el.innerHTML = results.map(r => `
      <div class="search-result" onclick="openBook('${esc(r.book_url)}','${esc(r.name)}')">
        <h4>${esc(r.name)}</h4>
        <p>${esc(r.author||'')} ${r.intro ? '— '+esc(r.intro.slice(0,60)) : ''}</p>
      </div>`).join('');
  } catch(e) { el.innerHTML = '<div class="empty">搜索失败: ' + e.message + '</div>'; }
}

function esc(s) { if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// ── 初始化 ──
showView('bookshelf');
</script>
</body>
</html>
