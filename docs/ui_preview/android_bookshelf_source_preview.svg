<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2400" viewBox="0 0 360 800">
  <defs>
    <linearGradient id="coverA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d3557"/><stop offset="1" stop-color="#457b9d"/></linearGradient>
    <linearGradient id="coverB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5b2333"/><stop offset="1" stop-color="#a44a3f"/></linearGradient>
    <linearGradient id="coverC" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#274c3d"/><stop offset="1" stop-color="#83a778"/></linearGradient>
    <linearGradient id="coverD" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#483d66"/><stop offset="1" stop-color="#9b7eac"/></linearGradient>
    <linearGradient id="coverE" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a65d32"/><stop offset="1" stop-color="#e4a853"/></linearGradient>
    <linearGradient id="coverF" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183642"/><stop offset="1" stop-color="#4f8795"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.18"/></filter>
    <style>
      .font { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      /* Android colors.xml stores these as ARGB; SVG uses opaque display equivalents. */
      .primary { fill: #212121; }
      .summary { fill: #6d6d6d; }
      .tiny { font-size: 10px; }
      .title { font-size: 12px; }
    </style>
  </defs>

  <!-- Android status bar and app background: colors.xml background=#FAFAFA -->
  <rect width="360" height="800" fill="#FAFAFA"/>
  <rect width="360" height="24" fill="#FAFAFA"/>
  <text x="16" y="16" class="font" font-size="10" fill="#5f6368">9:41</text>
  <g fill="none" stroke="#5f6368" stroke-width="1.4" stroke-linecap="round">
    <path d="M310 14h8M321 14h8M334 14h8"/>
    <path d="M347 10v8h7v-8z"/>
  </g>

  <!-- TitleBar from fragment_bookshelf1.xml -->
  <rect x="0" y="24" width="360" height="56" fill="#FAFAFA"/>
  <text x="16" y="59" class="font primary" font-size="20" font-weight="600">书架</text>
  <g fill="none" stroke="#383838" stroke-width="2" stroke-linecap="round">
    <circle cx="309" cy="49" r="7"/><path d="M314 54l6 6"/>
    <path d="M342 43v2M342 49v2M342 55v2"/>
  </g>

  <!-- view_bookshelf_header.xml, shown when bookshelf stats/recent reading are enabled -->
  <text x="16" y="99" class="font summary tiny">6 本书 · 3 在读</text>
  <rect x="16" y="108" width="328" height="42" rx="4" fill="#000000" fill-opacity="0.025"/>
  <text x="16" y="133" class="font summary tiny">继续阅读</text>
  <text x="76" y="133" class="font primary tiny" font-weight="600">诡秘之主</text>
  <text x="164" y="133" class="font summary tiny">第三百二十八章</text>
  <text x="313" y="133" class="font summary tiny">59%</text>
  <path d="M333 128l4 4-4 4" fill="none" stroke="#6d6d6d" stroke-width="1.3"/>

  <!-- RecyclerView grid: item_bookshelf_grid.xml, 3 columns -->
  <g filter="url(#shadow)">
    <g>
      <rect x="16" y="166" width="101" height="137" rx="4" fill="url(#coverA)"/>
      <circle cx="66" cy="214" r="22" fill="#f1faee" fill-opacity="0.16"/>
      <path d="M39 257h54" stroke="#dcecf3" stroke-width="1" stroke-opacity="0.7"/>
      <text x="66" y="228" text-anchor="middle" class="font" font-size="10" fill="#fff" font-weight="700">星海回响</text>
      <text x="66" y="243" text-anchor="middle" class="font" font-size="6.5" fill="#dcecf3">THE ECHO OF STARS</text>
      <rect x="16" y="301" width="101" height="2" fill="#039BE5"/>
    </g>
    <g>
      <rect x="129" y="166" width="101" height="137" rx="4" fill="url(#coverB)"/>
      <path d="M144 185h70v84h-70z" fill="none" stroke="#f7d6c8" stroke-width="1" stroke-opacity="0.65"/>
      <text x="179" y="221" text-anchor="middle" class="font" font-size="12" fill="#fff2e9" font-weight="700">长夜行</text>
      <text x="179" y="239" text-anchor="middle" class="font" font-size="7" fill="#f7d6c8">卷一 · 归途</text>
      <rect x="129" y="301" width="101" height="2" fill="#AD1457"/>
      <rect x="212" y="166" width="18" height="18" rx="0" fill="#eb4333"/>
      <text x="221" y="179" text-anchor="middle" class="font" font-size="10" fill="#fff">12</text>
    </g>
    <g>
      <rect x="242" y="166" width="101" height="137" rx="4" fill="url(#coverC)"/>
      <path d="M292 184l28 74h-56z" fill="#d9edca" fill-opacity="0.2"/>
      <text x="292" y="224" text-anchor="middle" class="font" font-size="11" fill="#f4faef" font-weight="700">风起青萍</text>
      <text x="292" y="240" text-anchor="middle" class="font" font-size="7" fill="#d9edca">一部山川志</text>
      <rect x="242" y="301" width="101" height="2" fill="#039BE5"/>
    </g>

    <g>
      <rect x="16" y="329" width="101" height="137" rx="4" fill="url(#coverD)"/>
      <circle cx="66" cy="382" r="25" fill="#efe6f7" fill-opacity="0.18"/>
      <text x="66" y="390" text-anchor="middle" class="font" font-size="11" fill="#fff" font-weight="700">月下书简</text>
      <text x="66" y="407" text-anchor="middle" class="font" font-size="7" fill="#efe6f7">Letters at Moonrise</text>
      <rect x="16" y="464" width="101" height="2" fill="#AD1457"/>
    </g>
    <g>
      <rect x="129" y="329" width="101" height="137" rx="4" fill="url(#coverE)"/>
      <path d="M148 432l20-73 20 73zM182 432l18-52 18 52z" fill="#fff0c1" fill-opacity="0.24"/>
      <text x="179" y="386" text-anchor="middle" class="font" font-size="11" fill="#fff8dc" font-weight="700">砂城纪事</text>
      <text x="179" y="403" text-anchor="middle" class="font" font-size="7" fill="#ffe9a8">边境 · 风沙 · 远方</text>
      <rect x="129" y="464" width="101" height="2" fill="#039BE5"/>
    </g>
    <g>
      <rect x="242" y="329" width="101" height="137" rx="4" fill="url(#coverF)"/>
      <path d="M251 429c22-56 55-56 84 0" fill="none" stroke="#c8e8ee" stroke-width="2" stroke-opacity="0.65"/>
      <text x="292" y="388" text-anchor="middle" class="font" font-size="11" fill="#effbff" font-weight="700">潮汐档案</text>
      <text x="292" y="405" text-anchor="middle" class="font" font-size="7" fill="#c8e8ee">第七航线</text>
      <rect x="242" y="464" width="101" height="2" fill="#AD1457"/>
      <rect x="325" y="329" width="18" height="18" rx="0" fill="#eb4333"/>
      <text x="334" y="342" text-anchor="middle" class="font" font-size="10" fill="#fff">3</text>
    </g>
  </g>

  <!-- book names below covers, matching item_bookshelf_grid.xml tv_name -->
  <g class="font primary title" text-anchor="middle">
    <text x="66" y="320">星海回响</text><text x="179" y="320">长夜行</text><text x="292" y="320">风起青萍</text>
    <text x="66" y="484">月下书简</text><text x="179" y="484">砂城纪事</text><text x="292" y="484">潮汐档案</text>
  </g>

  <!-- ThemeBottomNavigationVIew: labelVisibilityMode=unlabeled -->
  <rect x="0" y="736" width="360" height="64" fill="#FAFAFA"/>
  <line x1="0" y1="736" x2="360" y2="736" stroke="#e0e0e0" stroke-width="1"/>
  <g fill="none" stroke="#039BE5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M35 751h5v20h-5zM42 748h5v23h-5zM49 751h5v20h-5zM56 754h5v17h-5z"/>
    <path d="M34 773h29"/>
  </g>
  <g fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="135" cy="760" r="10"/><path d="M135 750v10l7 6M135 754l-5 5"/>
    <path d="M207 771a14 14 0 0 1 28 0M212 763a9 9 0 0 1 18 0M217 756a4 4 0 0 1 8 0"/>
    <circle cx="316" cy="754" r="7"/><path d="M304 773c2-7 7-10 12-10s10 3 12 10"/>
  </g>
</svg>
