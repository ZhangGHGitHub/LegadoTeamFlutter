name: iOS Build

on:
  push:
    paths:
      - 'flutter_legado/**'
      - 'rust/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      FLUTTER_VERSION: '3.44.8'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust (iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # rustup toolchain install --target 在镜像预装工具链上可能静默漏装目标 std，
      # 显式补装并留诊断（首跑 E0463 can not find core 根因）
      - name: Ensure Rust iOS targets
        # rust/rust-toolchain.toml 锁定 1.97.1：cargo 在 rust/ 下运行时会切换到
        # 该工具链，target 必须装进它而非 stable——working-directory 触发 toml 解析
        working-directory: rust
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustup target list --installed

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: flutter_legado
        run: flutter pub get

      # ── Rust FFI 静态库（真机 + 模拟器分开构建，不可 lipo 混合）──
      # rquickjs-sys 对 iOS 无预置绑定，apple 目标走 bindgen 运行时生成，
      # 需要对应 SDK 的 sysroot（SDKROOT 逐 target 注入）
      - name: Build Rust FFI (iOS device)
        working-directory: rust
        run: |
          set -euxo pipefail
          export SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          cargo rustc --release --target aarch64-apple-ios -p legado-ffi --lib --crate-type staticlib --features quickjs
          mkdir -p ../flutter_legado/ios/RustFFI
          cp target/aarch64-apple-ios/release/liblegado_ffi.a \
             ../flutter_legado/ios/RustFFI/libliblegado_ffi.a

      - name: Build Rust FFI (iOS simulator)
        working-directory: rust
        run: |
          set -euxo pipefail
          export SDKROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)
          # bindgen 把 rust 三元组 aarch64-apple-ios-sim 原样传 clang（无效），
          # 追加合法的 -simulator 三元组覆盖（clang 取最后一个 --target）
          export BINDGEN_EXTRA_CLANG_ARGS="--target=aarch64-apple-ios-simulator -isysroot $SDKROOT"
          cargo rustc --release --target aarch64-apple-ios-sim -p legado-ffi --lib --crate-type staticlib --features quickjs
          cp target/aarch64-apple-ios-sim/release/liblegado_ffi.a \
             /tmp/liblegado_ffi_sim.a

      # ── 真机未签名 ipa ──
      - name: CocoaPods install
        working-directory: flutter_legado/ios
        run: |
          pod install --repo-update

      - name: Build iOS (device, no codesign)
        working-directory: flutter_legado
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --verbose 2>&1 | tee ios_device_build.log

      # 防"真机 Rust 引擎初始化失败"回归：FRB 2.11 采用 PDE 分发器架构，
      # Dart 侧运行时 dlsym 查找固定符号 frb_pde_ffi_dispatcher_primary /
      # frb_init_frb_dart_api_dl（并非逐函数的 wire__* 符号）。Release 设备构建
      # 默认 strip 会剥掉符号表导致查不到——必须校验真实符号存在。
      # 注意：Apple strings 不扫描 Mach-O __LINKEDIT，须用 nm；iOS 二进制无法在
      # macOS 宿主上 dlopen（平台不兼容），dlopen/dlsym 测试不适用。
      - name: Verify Rust PDE symbols in device binary
        run: |
          set -euxo pipefail
          BIN=flutter_legado/build/ios/iphoneos/Runner.app/Runner
          echo "== 诊断：文件与 symtab =="
          ls -lh "$BIN"
          nm "$BIN" 2>&1 | head -3 || true
          TOTAL=$(nm "$BIN" 2>/dev/null | wc -l || true)
          echo "symtab total: $TOTAL"
          COUNT=$(nm -g "$BIN" 2>/dev/null | grep -c "frb_pde_ffi_dispatcher_primary" || true)
          echo "PDE dispatcher symbols (nm -g): $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::设备二进制缺少 FRB PDE 分发器符号——dlsym 运行时查找必然失败；检查 DEAD_CODE_STRIPPING / STRIP_INSTALLED_PRODUCT 是否生效"
            exit 1
          fi

      # 防「真机换图标 OSStatus -54」回归：CFBundleAlternateIcons 条目经
      # CFBundleIconName 声明变体图标，系统按 Assets.car 中 appiconset 名
      # （launcher1.appiconset…）解析——与主图标 AppIcon.appiconset 同一条
      # 已验证可用的解析路径（无扩展名 CFBundleIconFiles 条目不走该路径，
      # 2.0.138 真机复测 -54 已证）。appiconset 未编入 car 或文件名错配时
      # setAlternateIconName 真机失败（Carbon fNotFoundErr = -54）。
      # actool 默认只把 --app-icon 指定的主 appiconset 编入 Assets.car，变体
      # appiconset 会被静默跳过（2.0.140 CI 实证：槽位结构合法仍 0/6）；
      # Runner.xcodeproj 须声明 ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES +
      # INCLUDE_ALL_APPICON_ASSETS=YES（业界标准接线，expo-quick-actions 同款）。
      # 模拟器集成测试断言 altIconNames == launcher1~6（已安装 plist 声明结构）；
      # 此处先做确定性文件名核查，再对设备构建 Assets.car 做静态校验。
      # Xcode 16.4 的 car 名称表并非总是可按纯 ASCII grep，故先用 AppIcon（主图标，
      # 已知必在）标定：可 grep（ASCII/UTF-16 任一编码）→ 严格逐一校验 6 个 appiconset 名；
      # 不可 grep → 回退尺寸门禁（全目录压缩后 >500KB），避免误报。
      - name: Validate appiconset Contents.json filenames
        run: |
          set -euxo pipefail
          cd flutter_legado/ios/Runner/Assets.xcassets
          FAIL=0
          for D in launcher1.appiconset launcher2.appiconset launcher3.appiconset launcher4.appiconset launcher5.appiconset launcher6.appiconset; do
            for F in $(sed -n 's/.*"filename": *"\([^"]*\)".*/\1/p' "$D/Contents.json"); do
              [ -f "$D/$F" ] || { echo "::error::$D 引用了不存在的文件 $F"; FAIL=1; }
            done
          done
          [ "$FAIL" -eq 0 ] || exit 1

      # appiconset 槽位结构合法是编入 car 的必要（非充分）条件：actool 判定
      # 含未分配槽位图像（如 legacy iPhone 1x 槽）时会告警并跳过对应图像/整组
      # （2.0.139 CI 失败暴露了该缺陷；仅修复槽位仍不够，还须下方注释的
      # ALTERNATE_APPICON_NAMES 构建设置）。此处直接门禁该警告，
      # 确保任何槽位模型错配在构建期即暴露，不流入真机验收。
      - name: Verify no unassigned appiconset warnings in actool log
        run: |
          set -euxo pipefail
          LOG=flutter_legado/ios_device_build.log
          if grep -q "unassigned children" "$LOG"; then
            echo "::error::actool 报告 appiconset 存在未分配槽位图像——变体图标不会被编入 Assets.car，真机换图标将报 OSStatus -54"
            grep -n "unassigned children" "$LOG" | head -10
            exit 1
          fi
          echo "actool 无 unassigned children 警告（appiconset 槽位结构合法）"

      - name: Verify alternate icon appiconsets in Assets.car
        run: |
          set -euxo pipefail
          CAR=flutter_legado/build/ios/iphoneos/Runner.app/Assets.car
          ls -lh "$CAR"
          STR_ASCII=$(strings "$CAR" 2>/dev/null || true)
          STR_UTF16=$(strings -el "$CAR" 2>/dev/null || true)
          probe() { case "$STR_ASCII" in *"$1"*) return 0 ;; esac; case "$STR_UTF16" in *"$1"*) return 0 ;; esac; return 1; }
          if probe "AppIcon"; then
            echo "car 名称表可 grep（ASCII/UTF-16）——严格校验 6 个 appiconset 名"
            FOUND=0
            for I in 1 2 3 4 5 6; do
              N="launcher${I}"
              if probe "$N"; then FOUND=$((FOUND+1)); else echo "missing: $N"; fi
            done
            echo "appiconsets found in Assets.car: $FOUND/6"
            [ "$FOUND" -eq 6 ] || { echo "::error::Assets.car 缺少变体图标 appiconset——真机换图标将报 OSStatus -54"; exit 1; }
          else
            echo "AppIcon 名两种编码均不可 grep——car 名称表存储方式不同，回退尺寸门禁"
            SIZE=$(wc -c < "$CAR")
            [ "$SIZE" -ge 400000 ] || { echo "::error::Assets.car 仅 ${SIZE} 字节（全目录应 >500KB）——变体图标 appiconset 未编入"; exit 1; }
            echo "尺寸门禁通过: $SIZE 字节（此分支静态校验降级，最终权威 = 真机验收）"
          fi

      # 上传设备 Assets.car 供离线格式分析（约 600KB，失败时也上传以便排查）
      - name: Upload device Assets.car
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-assets-car
          path: flutter_legado/build/ios/iphoneos/Runner.app/Assets.car

      # 第六轮（-54 复发，iOS 17.5 真机）：universal app 的 legacy 图标路径缺口。
      # Xcode 只把 CFBundleIconFiles 中 76x76 尺寸的变体编为 iPad idiom 散文件
      # （launcherN76x76@2x~ipad.png），iPhone idiom 下该 base name 解析不到任何
      # 文件；若 LaunchServices 校验/回退 legacy 路径，每个变体图标注册即失效
      # → setAlternateIconName 报 Carbon fNotFoundErr（-54）。标准 capacitor/expo
      # 应用是纯 iPhone target、无 76x76 iPad 尺寸，故不存在此错位。
      # 修复：打包前为每个 launcher 补 76x76@1x/@2x 非 ipad 散文件（源图取
      # appiconset 内 ipad 槽位），使 CFBundleIconFiles 全部条目在 iPhone 可解析，
      # 同时保留 iPad 支持。car 现代路径（CFBundleIconName）不受影响。
      # 第七轮（真机实证：散文件12/12 仍 -54 → H2 legacy 缺口证伪）：
      # car 由 Xcode 16.4/SDK 18 actool 编译，本地取证发现其内无 PNG 签名
      # （图像记录为非 PNG 编码）——iOS 17.5 LaunchServices 若解不开该 car，
      # CFBundleIconName→car 的变体校验必然 fNotFoundErr（-54），与散文件无关。
      # 本批：① Assets.xcassets 新增常规 imageset probe_image（第七轮 H3 判定
      # 探针，app 内 UIImage(named:) 读取验证）；② 顺手补齐 60x60 @3x 散文件
      # （此前 bundle 根只有 @2x，缩放完整性缺口一并关闭）。
      - name: Inject iPhone-resolvable loose icon files (76x76 + 60x60@3x)
        run: |
          set -euxo pipefail
          APP=flutter_legado/build/ios/iphoneos/Runner.app
          ASSETS=flutter_legado/ios/Runner/Assets.xcassets
          for N in 1 2 3 4 5 6; do
            cp "$ASSETS/launcher${N}.appiconset/launcher${N}_76.png"  "$APP/launcher${N}76x76@1x.png"
            cp "$ASSETS/launcher${N}.appiconset/launcher${N}_152.png" "$APP/launcher${N}76x76@2x.png"
            cp "$ASSETS/launcher${N}.appiconset/launcher${N}_180.png" "$APP/launcher${N}60x60@3x.png"
          done
          # 主图标 60x60 @3x（bundle 根原只有 AppIcon60x60@2x.png）
          cp "$ASSETS/AppIcon.appiconset/Icon-App-60x60@3x.png" "$APP/AppIcon60x60@3x.png"
          echo "== 注入后 bundle 根散文件 =="
          ls -l "$APP"/launcher*{60x60,76x76}*.png "$APP"/AppIcon*.png

      # 第八轮（真机实证：散文件12/12 仍 -54 → H2 legacy 缺口证伪；GitHub 调研）：
      # 社区实证结构（tastelessjolt/flutter_dynamic_icon 123★、chandrabezzo fork、
      # capacitor/expo legacy 路径）为纯 legacy——CFBundleIconFiles + bundle 根散文件，
      # 完全不出现 CFBundleIconName。本 app 是结构性离群者：Xcode 为每个备选自动生成
      # 双路径（现代 CFBundleIconName→car + legacy CFBundleIconFiles），LaunchServices
      # 若优先按现代路径解析、而 iOS 17.5 解不开 Xcode 16.4/SDK 18 编的 car →
      # fNotFoundErr (-54)，与散文件是否齐全无关。
      # 修复：打包前从所有 CFBundleAlternateIcons 条目剥离 CFBundleIconName（CFBundleIcons
      # 与 ~ipad 两节），强制走与社区实证结构一致的纯 legacy 解析路径；散文件 12/12 已
      # 注入（下方门禁保证可解析）。主图标不受影响。
      - name: Strip CFBundleIconName from alternate icons (force legacy path)
        run: |
          set -euo pipefail
          APP=flutter_legado/build/ios/iphoneos/Runner.app
          # 门禁：打包前 12 个 base name 散文件必须全部可解析（纯 legacy 路径前提）
          for N in 1 2 3 4 5 6; do
            for B in "launcher${N}60x60@2x" "launcher${N}60x60@3x" "launcher${N}76x76@1x" "launcher${N}76x76@2x"; do
              [ -f "$APP/$B.png" ] || { echo "::error::missing $B.png (legacy 散文件不齐)"; exit 1; }
            done
          done
          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          p = sys.argv[1]
          with open(p, "rb") as f:
              d = plistlib.load(f)
          stripped = 0
          for section in ("CFBundleIcons", "CFBundleIcons~ipad"):
              icons = d.get(section)
              if not isinstance(icons, dict):
                  continue
              alt = icons.get("CFBundleAlternateIcons")
              if not isinstance(alt, dict):
                  continue
              for name, entry in alt.items():
                  if isinstance(entry, dict) and "CFBundleIconName" in entry:
                      del entry["CFBundleIconName"]
                      stripped += 1
          with open(p, "wb") as f:
              plistlib.dump(d, f)
          print(f"stripped CFBundleIconName from {stripped} alternate entries (expected 12)")
          assert stripped >= 6, f"expected at least 6 (primary section), got {stripped}"
          if stripped != 12:
              print(f"::warning::expected 12 (6 alternates x 2 sections), got {stripped}")
          PY
          # 验证：最终 plist 备选条目无 CFBundleIconName 残留，legacy 键完整
          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          d = plistlib.load(open(sys.argv[1], "rb"))
          for section in ("CFBundleIcons", "CFBundleIcons~ipad"):
              alt = (d.get(section) or {}).get("CFBundleAlternateIcons") or {}
              for name in sorted(alt):
                  e = alt[name]
                  print(f"{section}/{name}: iconFiles={e.get('CFBundleIconFiles')} iconName={'MISSING' if 'CFBundleIconName' not in e else e['CFBundleIconName']}")
          PY

      # 导出最终设备 Info.plist 工件（「最终包图标声明」链接的永久门禁）：
      # 第四轮 -54 取证证明 CI 构建产物本身完整（car 6/6 appiconset +
      # CFBundleIconName 声明 + Xcode 自动注入的 bundle 根散文件双路径），
      # 真机失败复发时可直接比对最终 plist，无需下载解包 IPA。
      # 第八轮：移至剥离步之后——工件反映「最终包图标声明」（剥离后状态）。
      - name: Export device Info.plist (icon section)
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          PL=flutter_legado/build/ios/iphoneos/Runner.app/Info.plist
          OUT=flutter_legado/build/ios/device-plist
          mkdir -p "$OUT"
          cp "$PL" "$OUT/Info.plist"
          python3 -c 'import plistlib,json,sys; d=plistlib.load(open(sys.argv[1],"rb")); print(json.dumps({k:v for k,v in d.items() if "Icon" in k}, indent=2))' "$PL" > "$OUT/icon-section.json"

      - name: Upload device Info.plist
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-info-plist
          path: flutter_legado/build/ios/device-plist/

      - name: Package unsigned IPA
        working-directory: flutter_legado/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qry app-unsigned.ipa Payload
          ls -lh app-unsigned.ipa

      - name: Upload device build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-build-log
          path: flutter_legado/ios_device_build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: legado-ios-unsigned-ipa
          path: flutter_legado/build/ios/iphoneos/app-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      # ── 模拟器冒烟（启动到首屏 + 截图回传）──
      - name: Build iOS (simulator)
        working-directory: flutter_legado
        run: |
          cp /tmp/liblegado_ffi_sim.a ios/RustFFI/libliblegado_ffi.a
          # pod install 只在设备构建前跑过一次，ios/Pods/RustFFI/ 里仍是设备 .a；
          # 换入模拟器 .a 后必须重新 pod install，否则 vendored_libraries 引用过期
          # 设备库导致平台错配、RustFFI 未被真正链接（Runner 退化成 153K 桩）
          cd ios && pod install --repo-update && cd ..
          flutter build ios --simulator --debug

      # Flutter DEBUG iOS 构建把主体代码放在 Runner.debug.dylib（Runner 只是
      # 加载桩，约 150K）——校验须覆盖两者之一含 PDE 符号即可。
      - name: Verify Rust PDE symbols in simulator binary
        run: |
          set -euxo pipefail
          APPDIR=flutter_legado/build/ios/iphonesimulator/Runner.app
          echo "== 诊断：候选文件 =="
          ls -lh "$APPDIR"/Runner "$APPDIR"/Runner.debug.dylib 2>/dev/null || true
          OK=0
          for F in "$APPDIR/Runner" "$APPDIR/Runner.debug.dylib"; do
            [ -f "$F" ] || continue
            C=$(nm -g "$F" 2>/dev/null | grep -c "frb_pde_ffi_dispatcher_primary" || true)
            echo "$(basename "$F"): PDE symbols = $C (symtab total $(nm "$F" 2>/dev/null | wc -l))"
            [ "$C" -ge 1 ] && OK=1
          done
          if [ "$OK" != "1" ]; then
            echo "::error::模拟器构建产物缺少 FRB PDE 分发器符号（Runner 与 Runner.debug.dylib 均无）"
            exit 1
          fi

      # ── 换图标集成测试（Bug1：iOS 运行时取证 + 回归门禁）──
      # 此时 ios/RustFFI/ 中是模拟器 .a 且 pod install 已完成，flutter test
      # 会自行构建测试宿主 app 并在指定模拟器上运行。注意 flutter test -d <UDID>
      # 要求模拟器已 boot（devices available 只是设备定义），故此处先自举启动；
      # 后续「Boot simulator and launch app」步骤的 boot 幂等，不受影响。
      # 门禁 = status 同步方法（通道接线 + Info.plist 变体声明）；真实 set
      # 仅取证——模拟器 setAlternateIconName completion 不回调（已知限制），
      # 测试内带超时守护只记录结果，不断言。
      - name: Run launcher icon integration test (iOS simulator)
        working-directory: flutter_legado
        run: |
          set -euxo pipefail
          UDID=$(xcrun simctl list devices available | grep -m1 -oE '[0-9A-F-]{36}')
          echo "Integration test simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          flutter test integration_test/launcher_icon_ios_test.dart -d "$UDID"

      - name: Upload simulator Runner.app (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-runner-app
          path: flutter_legado/build/ios/iphonesimulator/Runner.app
          retention-days: 7
          if-no-files-found: ignore

      - name: Boot simulator and launch app
        run: |
          set -euxo pipefail
          UDID=$(xcrun simctl list devices available | grep -m1 -oE '[0-9A-F-]{36}')
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" flutter_legado/build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$UDID" io.legado.flutterLegado
          sleep 25
          xcrun simctl io "$UDID" screenshot smoke_home.png || true
          # 进程存活检查（启动 25 秒后仍未退出 = 未崩溃）
          xcrun simctl spawn "$UDID" launchctl list | grep -i flutter || true

      - name: Collect simulator logs
        if: always()
        run: |
          UDID=${{ env.UDID }}
          if [ -n "$UDID" ]; then
            xcrun simctl spawn "$UDID" log show --last 3m \
              --predicate 'processImagePath CONTAINS "Runner"' \
              > sim_runner.log || true
            grep -iE "fatal|crash|rust|panicked" sim_runner.log | head -40 > sim_errors.log || true
          fi

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-evidence
          path: |
            smoke_home.png
            sim_runner.log
            sim_errors.log
          retention-days: 14
          if-no-files-found: warn
