name: iOS Build

on:
  push:
    paths:
      - 'flutter_legado/**'
      - 'rust/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      FLUTTER_VERSION: '3.44.8'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust (iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # rustup toolchain install --target 在镜像预装工具链上可能静默漏装目标 std，
      # 显式补装并留诊断（首跑 E0463 can not find core 根因）
      - name: Ensure Rust iOS targets
        # rust/rust-toolchain.toml 锁定 1.97.1：cargo 在 rust/ 下运行时会切换到
        # 该工具链，target 必须装进它而非 stable——working-directory 触发 toml 解析
        working-directory: rust
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustup target list --installed

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: flutter_legado
        run: flutter pub get

      # ── Rust FFI 静态库（真机 + 模拟器分开构建，不可 lipo 混合）──
      # rquickjs-sys 对 iOS 无预置绑定，apple 目标走 bindgen 运行时生成，
      # 需要对应 SDK 的 sysroot（SDKROOT 逐 target 注入）
      - name: Build Rust FFI (iOS device)
        working-directory: rust
        run: |
          set -euxo pipefail
          export SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          cargo rustc --release --target aarch64-apple-ios -p legado-ffi --lib --crate-type staticlib --features quickjs
          mkdir -p ../flutter_legado/ios/RustFFI
          cp target/aarch64-apple-ios/release/liblegado_ffi.a \
             ../flutter_legado/ios/RustFFI/libliblegado_ffi.a

      - name: Build Rust FFI (iOS simulator)
        working-directory: rust
        run: |
          set -euxo pipefail
          export SDKROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)
          # bindgen 把 rust 三元组 aarch64-apple-ios-sim 原样传 clang（无效），
          # 追加合法的 -simulator 三元组覆盖（clang 取最后一个 --target）
          export BINDGEN_EXTRA_CLANG_ARGS="--target=aarch64-apple-ios-simulator -isysroot $SDKROOT"
          cargo rustc --release --target aarch64-apple-ios-sim -p legado-ffi --lib --crate-type staticlib --features quickjs
          cp target/aarch64-apple-ios-sim/release/liblegado_ffi.a \
             /tmp/liblegado_ffi_sim.a

      # ── 真机未签名 ipa ──
      - name: CocoaPods install
        working-directory: flutter_legado/ios
        run: |
          pod install --repo-update

      - name: Build iOS (device, no codesign)
        working-directory: flutter_legado
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --verbose 2>&1 | tee ios_device_build.log

      # 防"真机 Rust 引擎初始化失败"回归：FRB 2.11 采用 PDE 分发器架构，
      # Dart 侧运行时 dlsym 查找固定符号 frb_pde_ffi_dispatcher_primary /
      # frb_init_frb_dart_api_dl（并非逐函数的 wire__* 符号）。Release 设备构建
      # 默认 strip 会剥掉符号表导致查不到——必须校验真实符号存在。
      # 注意：Apple strings 不扫描 Mach-O __LINKEDIT，须用 nm；iOS 二进制无法在
      # macOS 宿主上 dlopen（平台不兼容），dlopen/dlsym 测试不适用。
      - name: Verify Rust PDE symbols in device binary
        run: |
          set -euxo pipefail
          BIN=flutter_legado/build/ios/iphoneos/Runner.app/Runner
          echo "== 诊断：文件与 symtab =="
          ls -lh "$BIN"
          nm "$BIN" 2>&1 | head -3 || true
          TOTAL=$(nm "$BIN" 2>/dev/null | wc -l || true)
          echo "symtab total: $TOTAL"
          COUNT=$(nm -g "$BIN" 2>/dev/null | grep -c "frb_pde_ffi_dispatcher_primary" || true)
          echo "PDE dispatcher symbols (nm -g): $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::设备二进制缺少 FRB PDE 分发器符号——dlsym 运行时查找必然失败；检查 DEAD_CODE_STRIPPING / STRIP_INSTALLED_PRODUCT 是否生效"
            exit 1
          fi

      # 防「真机换图标 OSStatus -54」回归：Info.plist CFBundleIconFiles 无扩展名
      # 条目由系统按 Assets.car imageset 名解析——任一 imageset 未编入编译后的
      # 目录，真机即解析失败（Carbon fNotFoundErr = -54）。模拟器集成测试的
      # assetCount 门禁覆盖运行时查找；此处对设备构建 Assets.car 做静态全量校验。
      - name: Verify alternate icon imagesets in Assets.car
        run: |
          set -euxo pipefail
          CAR=flutter_legado/build/ios/iphoneos/Runner.app/Assets.car
          ls -lh "$CAR"
          FOUND=0
          for I in 1 2 3 4 5 6; do
            for S in 20 29 40 58 60 76 80 87 120 152 167 180 1024; do
              N="launcher${I}_${S}"
              if strings "$CAR" | grep -q "$N"; then FOUND=$((FOUND+1)); else echo "missing: $N"; fi
            done
          done
          echo "imagesets found in Assets.car: $FOUND/78"
          [ "$FOUND" -eq 78 ] || { echo "::error::Assets.car 缺少变体图标 imageset——真机换图标将报 OSStatus -54"; exit 1; }

      - name: Package unsigned IPA
        working-directory: flutter_legado/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qry app-unsigned.ipa Payload
          ls -lh app-unsigned.ipa

      - name: Upload device build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-build-log
          path: flutter_legado/ios_device_build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: legado-ios-unsigned-ipa
          path: flutter_legado/build/ios/iphoneos/app-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      # ── 模拟器冒烟（启动到首屏 + 截图回传）──
      - name: Build iOS (simulator)
        working-directory: flutter_legado
        run: |
          cp /tmp/liblegado_ffi_sim.a ios/RustFFI/libliblegado_ffi.a
          # pod install 只在设备构建前跑过一次，ios/Pods/RustFFI/ 里仍是设备 .a；
          # 换入模拟器 .a 后必须重新 pod install，否则 vendored_libraries 引用过期
          # 设备库导致平台错配、RustFFI 未被真正链接（Runner 退化成 153K 桩）
          cd ios && pod install --repo-update && cd ..
          flutter build ios --simulator --debug

      # Flutter DEBUG iOS 构建把主体代码放在 Runner.debug.dylib（Runner 只是
      # 加载桩，约 150K）——校验须覆盖两者之一含 PDE 符号即可。
      - name: Verify Rust PDE symbols in simulator binary
        run: |
          set -euxo pipefail
          APPDIR=flutter_legado/build/ios/iphonesimulator/Runner.app
          echo "== 诊断：候选文件 =="
          ls -lh "$APPDIR"/Runner "$APPDIR"/Runner.debug.dylib 2>/dev/null || true
          OK=0
          for F in "$APPDIR/Runner" "$APPDIR/Runner.debug.dylib"; do
            [ -f "$F" ] || continue
            C=$(nm -g "$F" 2>/dev/null | grep -c "frb_pde_ffi_dispatcher_primary" || true)
            echo "$(basename "$F"): PDE symbols = $C (symtab total $(nm "$F" 2>/dev/null | wc -l))"
            [ "$C" -ge 1 ] && OK=1
          done
          if [ "$OK" != "1" ]; then
            echo "::error::模拟器构建产物缺少 FRB PDE 分发器符号（Runner 与 Runner.debug.dylib 均无）"
            exit 1
          fi

      # ── 换图标集成测试（Bug1：iOS 运行时取证 + 回归门禁）──
      # 此时 ios/RustFFI/ 中是模拟器 .a 且 pod install 已完成，flutter test
      # 会自行构建测试宿主 app 并在指定模拟器上运行。注意 flutter test -d <UDID>
      # 要求模拟器已 boot（devices available 只是设备定义），故此处先自举启动；
      # 后续「Boot simulator and launch app」步骤的 boot 幂等，不受影响。
      # 门禁 = status 同步方法（通道接线 + Info.plist 变体声明）；真实 set
      # 仅取证——模拟器 setAlternateIconName completion 不回调（已知限制），
      # 测试内带超时守护只记录结果，不断言。
      - name: Run launcher icon integration test (iOS simulator)
        working-directory: flutter_legado
        run: |
          set -euxo pipefail
          UDID=$(xcrun simctl list devices available | grep -m1 -oE '[0-9A-F-]{36}')
          echo "Integration test simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          flutter test integration_test/launcher_icon_ios_test.dart -d "$UDID"

      - name: Upload simulator Runner.app (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-runner-app
          path: flutter_legado/build/ios/iphonesimulator/Runner.app
          retention-days: 7
          if-no-files-found: ignore

      - name: Boot simulator and launch app
        run: |
          set -euxo pipefail
          UDID=$(xcrun simctl list devices available | grep -m1 -oE '[0-9A-F-]{36}')
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" flutter_legado/build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$UDID" io.legado.flutterLegado
          sleep 25
          xcrun simctl io "$UDID" screenshot smoke_home.png || true
          # 进程存活检查（启动 25 秒后仍未退出 = 未崩溃）
          xcrun simctl spawn "$UDID" launchctl list | grep -i flutter || true

      - name: Collect simulator logs
        if: always()
        run: |
          UDID=${{ env.UDID }}
          if [ -n "$UDID" ]; then
            xcrun simctl spawn "$UDID" log show --last 3m \
              --predicate 'processImagePath CONTAINS "Runner"' \
              > sim_runner.log || true
            grep -iE "fatal|crash|rust|panicked" sim_runner.log | head -40 > sim_errors.log || true
          fi

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-evidence
          path: |
            smoke_home.png
            sim_runner.log
            sim_errors.log
          retention-days: 14
          if-no-files-found: warn
