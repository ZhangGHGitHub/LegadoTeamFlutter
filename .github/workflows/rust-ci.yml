name: Rust CI
on:
  push:
    paths: ['rust/**']
  pull_request:
    paths: ['rust/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Cargo fmt check
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Cargo check
        working-directory: rust
        run: cargo check --workspace
      - name: Cargo clippy (default features)
        working-directory: rust
        run: cargo clippy --workspace -- -D warnings
      - name: Cargo clippy (quickjs — 体检§三.10 门控代码此前从未 lint)
        working-directory: rust
        run: cargo clippy -p legado-js -p legado-ffi --features quickjs -- -D warnings
      - name: Cargo test
        working-directory: rust
        run: cargo test --workspace
      - name: Cargo test (quickjs)
        working-directory: rust
        run: cargo test -p legado-js --features quickjs
      - name: Cargo test legado-ffi full (quickjs)
        working-directory: rust
        run: cargo test -p legado-ffi --features quickjs
      # [体检 N7] 依赖漏洞门禁：RustSec Advisory Database 扫描
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Cargo audit (RustSec advisories)
        working-directory: rust
        run: cargo audit
