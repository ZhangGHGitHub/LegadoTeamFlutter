name: Rust CI
on:
  push:
    paths: ['rust/**']
  pull_request:
    paths: ['rust/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Cargo check (exclude ffi)
        working-directory: rust
        run: cargo check --workspace --exclude legado-ffi
      - name: Cargo clippy (exclude ffi)
        working-directory: rust
        run: cargo clippy --workspace --exclude legado-ffi -- -D warnings
      - name: Cargo test (exclude ffi)
        working-directory: rust
        run: cargo test --workspace --exclude legado-ffi
      - name: Cargo test (quickjs)
        working-directory: rust
        run: cargo test -p legado-js --features quickjs
      # legado-ffi 单独走 quickjs 构建 + JS 书源解析冒烟（其余步骤对 ffi --exclude）
      - name: Cargo build legado-ffi (quickjs)
        working-directory: rust
        run: cargo build -p legado-ffi --features quickjs
      - name: Cargo test legado-ffi JS executor smoke (quickjs)
        working-directory: rust
        run: cargo test -p legado-ffi --features quickjs js_executor
