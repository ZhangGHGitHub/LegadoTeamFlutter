name: Rust CI
on:
  push:
    paths: ['rust/**']
  pull_request:
    paths: ['rust/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Cargo fmt check
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Cargo check
        working-directory: rust
        run: cargo check --workspace
      - name: Cargo clippy (default features)
        working-directory: rust
        run: cargo clippy --workspace -- -D warnings
      - name: Cargo clippy (quickjs — 体检§三.10 门控代码此前从未 lint)
        working-directory: rust
        run: cargo clippy -p legado-js -p legado-ffi --features quickjs -- -D warnings
      - name: Cargo test
        working-directory: rust
        run: cargo test --workspace
      # [P2-7(b) 2026-09-19 → 本版收口] test_sandbox_memory_limit 原脚本
      # （arr.push(new Array(1000).fill('x')) 十万次循环）踩的是 quickjs-ng 0.8 的 OOM 缺陷：
      # 首次 OOM 抛错 → JS_CallInternal 补栈回溯 → build_backtrace 内二次 OOM →
      # JS_Throw 释放的正是待补栈回溯的 error object（quickjs.c:6471 → free_object 置
      # p->shape=NULL，quickjs.c:5567）→ 末行 JS_DefinePropertyValue 解引用已释放对象 →
      # SIGSEGV（find_own_property，quickjs.c:5337：sh==NULL，`mov eax,[rax+0x20]`，rax=0）。
      # 是否触发取决于「首次失败后剩余多少 JS 堆余量」这一跨环境刀锋条件 → CI 间歇红；
      # 隔离单跑并不能解决（run 35428715961 的串行单跑仍崩，WSL 单跑 8/8 却通过）。
      # 根治：用例改为「单次巨量分配」保守脚本（engine.rs::test_sandbox_memory_limit），
      # WSL(Linux)/Windows 各 5 档上限（256KB/384KB/512KB/1MB/64MB）实测「返回 Err 且不崩」。
      # 故撤销 --skip 与串行隔离步骤，用例回归主测试档（覆盖不减、CI 结构复原）。
      - name: Cargo test (quickjs)
        working-directory: rust
        run: cargo test -p legado-js --features quickjs
      - name: Cargo test legado-ffi full (quickjs)
        working-directory: rust
        run: cargo test -p legado-ffi --features quickjs
      # [体检 N7] 依赖漏洞门禁：RustSec Advisory Database 扫描
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Cargo audit (RustSec advisories)
        working-directory: rust
        run: cargo audit
