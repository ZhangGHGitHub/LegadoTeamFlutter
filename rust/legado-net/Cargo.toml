[package]
name = "legado-net"
version = "0.2.0"
edition = "2021"
# 内部 crate，不对外发布：仅作为本 workspace 的路径依赖被 legado-ffi /
# legado-server 等消费（无 description/license/repository/readme 发布面，
# CI 也无 cargo publish 流程）。公开 API 只对仓内调用方负责，删除
# `url_template` 等内部导出不构成外部破坏性变更，无需升 minor。
publish = false

[dependencies]
legado-core = { path = "../legado-core" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
# gzip/brotli/deflate：对齐上游 OkHttp 透明解压缩（reqwest 自动设置 Accept-Encoding 并解压）
# socks：支持 SOCKS5 代理（含 user:pass 凭据，对齐上游 Socks5Proxy.kt）
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "http2", "charset", "gzip", "brotli", "deflate", "socks", "stream"] }
url = "2"
regex = "1"
log = "0.4"
base64 = { workspace = true }
# [批16a | 2026-10-27] 直链上传（契约 §2.51）：内存 zip 压缩（单条目、Deflated）。
# 与 legado-book/legado-ffi 同版本，lock 中既有 crate 零新增传递依赖
zip = "2"
# reqwest Body 构造复用 Bytes（重试时 clone 为引用计数拷贝，避免大文件整块复制）；
# lock 中既有 1.x 传递依赖，此处仅新增直接依赖边
bytes = "1"
quick-xml = "0.42"
urlencoding = "2.1"
async-trait = "0.1"
futures-core = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
filetime = "0.2"
tokio = { workspace = true, features = ["full"] }
# 测试用：构造 gzip 压缩响应体
flate2 = "1"
# 测试用：自签证书 TLS mock 服务端（验证 fetch_subscription 恢复证书校验）。
# lock 中已有 rustls 0.23 传递依赖；仅新增 dev 直接依赖边，ring provider
# 与 reqwest 的 rustls-tls 一致，不引入 aws-lc-rs。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
