[dependencies]
legado-core = { path = "../legado-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls", "rustls-tls-native-roots"] }
