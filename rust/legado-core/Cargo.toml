[package]
name = "legado-core"
version = "0.2.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }
aes = { workspace = true }
cbc = { workspace = true }
ecb = { workspace = true }
des = { workspace = true }
base64 = { workspace = true }
md5 = "0.7"
regex = "1"
# HighlightRule.uuid 随机生成与合法性校验（P2-11，对齐原版 java.util.UUID）
uuid = { workspace = true }
# 安全正则编译缓存的 LRU 淘汰（任务 #60 ④，与 legado-js 同版本）
lru = "0.12"
# Java 正则方言支持（lookbehind / backreference / 原子组等 regex crate 不支持的语法）
fancy-regex = "0.19.0"
# [批15 回修] 替换规则错误/超时 debug 日志（不打印正文内容；同版本已在工作区依赖图）
log = "0.4"
# 隐私密码凭据（批9a，契约 §2.53）：PBKDF2-HMAC-SHA256 210000 次 / 32B verifier。
# 用户已授权隐私完整版（当前仅数据层）；三 crate 均已在 Cargo.lock，无新增传递依赖面。
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"

[features]
default = []
# 占位 feature：本 crate 的 JS 执行通过 ReplaceJsExecutor trait 注入（实现位于 legado-js），
# 保留 quickjs feature 仅为与工作区统一构建命令 `--features quickjs` 兼容。
quickjs = []

[dev-dependencies]
