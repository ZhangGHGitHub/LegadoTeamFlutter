[package]
name = "legado-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
legado-core = { path = "../legado-core" }
legado-parser = { path = "../legado-parser" }
legado-net = { path = "../legado-net" }
legado-js = { path = "../legado-js" }
legado-book = { path = "../legado-book" }
legado-db = { path = "../legado-db" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled"] }
flutter_rust_bridge = "=2.12.0"
