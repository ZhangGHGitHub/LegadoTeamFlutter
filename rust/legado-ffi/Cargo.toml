[package]
name = "legado-ffi"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
legado-core = { path = "../legado-core" }
legado-parser = { path = "../legado-parser" }
legado-net = { path = "../legado-net" }
legado-js = { path = "../legado-js" }
# [P5 子批 2a | 2026-10-01] 书源抓取本体（web_book/js 适配/限流表/book_type）
legado-fetcher = { path = "../legado-fetcher" }
legado-book = { path = "../legado-book" }
legado-db = { path = "../legado-db" }
legado-server = { path = "../legado-server" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
futures = "0.3"
log = "0.4"
# [P4-2a | 2026-09-29] 图片磁盘缓存文件命名（对齐原版 MD5Utils.md5Encode16）
md5 = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
chrono = "0.4"
# [V-B2 | 2026-10-05] B 站弹幕 XML 解析（契约 §2.50）；与 legado-book/legado-net 同版本
quick-xml = "0.42"
# [批9 | 2026-10-26] 原版 zip 备份恢复：读包/条目校验。与 legado-book 同版本，
# 该 crate 已由其生产依赖编译进产物——本次仅新增 legado-ffi 的直接依赖边，
# 无新增 crate、无许可变更（Cargo.lock 版本不变）
zip = "2"
# [批7b-1 | 2026-11-09] 书签标记保存：空 id 生成 UUID v4（契约 §2.52；
# workspace 既有依赖，零新增 crate）
uuid = { workspace = true }
flutter_rust_bridge = "=2.11.1"

[dev-dependencies]
encoding_rs = "0.8"
# 提示 1：lib 单测（http_state.rs）与 tests/ 集成二进制使用
# `cookie_store::test_clear_memory_only`——该面仅 test-support feature 下可见
legado-js = { path = "../legado-js", features = ["test-support"] }
# [批17] App/Web `@js:` 一致性测试直连 legado-server 真实路由（axum/tower
# 均为 legado-server 既有依赖，版本与工作区一致，零新增 crate）
axum = "0.8"
tower = { version = "0.5", features = ["util"] }

# Unix 平台线程降权（nice 19）：修复多源搜索 CPU 风暴饿死 Flutter UI 线程
[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
libc = "0.2"

[features]
default = []
# quickjs 透传 legado-js 与 legado-fetcher：两 crate 的 JS 构造档必须一致，
# 否则 ffi 侧 re-export 会取到 fetcher 的非 quickjs 降级实现。
# [批17] 同步透传 legado-server/quickjs：server 侧仍有仅在该 feature 下可用的
# JS 能力（MCP eval_js、书源检验、段评 JS 等），App 内嵌 Web 必须与独立
# server 行为一致。注意：`/testReplaceRule` 与正文 `@js:` 已改由 legado-js
# 共享执行器门控，不依赖本透传（透传只钉 server 独有 quickjs 路径）。
quickjs = [
    "legado-js/quickjs",
    "legado-fetcher/quickjs",
    "legado-server/quickjs",
]

# 调试 example 依赖 quickjs 路径的 QuickJsExecutor：无 quickjs 构建时跳过编译
[[example]]
name = "dbg_build_url"
required-features = ["quickjs"]

[[example]]
name = "dbg_jslib"
required-features = ["quickjs"]

# [夹具缺陷修复 | 2026-09-27] 批量搜索扫描同样依赖 QuickJsExecutor——无
# quickjs 构建下 @js:/<js> searchUrl 不求值，原始规则文本被当字面 URL，
# JS 源全部静默产出假结果（实测 16 源 3 秒跑完、艾格/听笔趣阁等 JS 源
# 全部伪 http_error）。与 dbg_* 同款门控：无 feature 直接拒绝编译
[[example]]
name = "scan_search_sources"
required-features = ["quickjs"]
