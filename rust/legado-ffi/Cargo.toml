[package]
name = "legado-ffi"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
legado-core = { path = "../legado-core" }
legado-parser = { path = "../legado-parser" }
legado-net = { path = "../legado-net" }
legado-js = { path = "../legado-js" }
legado-book = { path = "../legado-book" }
legado-db = { path = "../legado-db" }
legado-server = { path = "../legado-server" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
futures = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
flutter_rust_bridge = "=2.11.1"

[features]
default = []
quickjs = ["legado-js/quickjs"]
