# 仓库级 Cargo 配置 intentionally 保持最小化。
#
# 本机 Android NDK 交叉编译 linker 请写入用户级配置，勿提交仓库：
#   Windows: %USERPROFILE%\.cargo\config.toml
#   Linux/macOS: ~/.cargo/config.toml
#
# 示例（路径按本机 NDK 安装调整）：
# [target.aarch64-linux-android]
# linker = ".../aarch64-linux-android21-clang"
#
# crates.io 镜像同理：仅在 CI 或开发者本机 config 中配置，避免绑定单一镜像源。
