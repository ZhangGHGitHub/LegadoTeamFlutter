[package]
name = "legado-fetcher"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
legado-core = { path = "../legado-core" }
legado-parser = { path = "../legado-parser" }
legado-net = { path = "../legado-net" }
legado-js = { path = "../legado-js" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
futures = "0.3"
encoding_rs = "0.8"
# [P2-19 尾项 | 2026-10-01 用户批准] charset 第四级统计探测（HTTP 三级无果时
# 兜底：显式 charset → Content-Type → HTML meta → chardetng 探测 → lossy UTF-8）
chardetng = "1.0"
# [批15b | 2026-10-26] RSS sortUrl 脚本求值缓存键：对齐原版
# `RssSourceExtensions.getSortUrlsKey()` 的 MD5Utils.md5Encode(sourceUrl + sortUrl)。
# 与 legado-core / legado-db / legado-ffi 同版本，无新增 crate 版本面。
md5 = "0.7"

[dev-dependencies]
base64 = { workspace = true }
# 测试支撑面（与 legado-ffi 同款）：cookie_store 等 test-support 门控 API
legado-js = { path = "../legado-js", features = ["test-support"] }

[features]
default = []
quickjs = ["legado-js/quickjs"]
