[package]
name = "legado-db"
version = "0.2.0"
edition = "2021"

[dependencies]
legado-core = { path = "../legado-core" }
# 逐键配置回退告警（app_config；与 legado-core/net/fetcher/ffi 同主版本）
log = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
md5 = "0.7"
# 迁移存量 highlightRules 行 uuid 随机回填（P2-11，对齐原版 UUID.randomUUID()）
uuid = { workspace = true }
