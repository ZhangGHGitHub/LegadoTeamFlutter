[workspace]
resolver = "2"
members = [
    "legado-core",
    "legado-parser",
    "legado-net",
    "legado-js",
    "legado-book",
    "legado-db",
    "legado-fetcher",
    "legado-ffi",
    "legado-server",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
aes = "0.8"
cbc = "0.1"
ecb = "0.1"
des = "0.8"
base64 = "0.22"
regex = "1"
# UUID 生成/解析（highlightRules.uuid 对齐原版 UUID.randomUUID()；lock 中既有 1.x，零新增传递依赖）
uuid = { version = "1", features = ["v4"] }
