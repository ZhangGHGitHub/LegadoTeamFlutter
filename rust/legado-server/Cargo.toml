[package]
name = "legado-server"
version = "0.2.0"
edition = "2021"

[dependencies]
legado-core = { path = "../legado-core" }
legado-db = { path = "../legado-db" }
legado-net = { path = "../legado-net" }
legado-book = { path = "../legado-book" }
# MCP eval_js 工具依赖的书源 JS 引擎（quickjs 为可选透传 feature）
legado-js = { path = "../legado-js" }
# [P5-1 链 b] 书源抓取共享实现（server/ffi 单一来源；quickjs 透传见 features）
legado-fetcher = { path = "../legado-fetcher" }
# B4 段评 legacy 端点：AnalyzeUrl（URL 规则解析）与 review_rule_parser
# （parse_summary_with/parse_detail_page_with/parse_reply_page_with）；
# 与 ffi review_api 同一解析实现（单实现原则），仅依赖方向不同
legado-parser = { path = "../legado-parser" }

# multipart：B3 POST /addLocalBook（vue 传书页 fileName/fileData 表单）
axum = { version = "0.8", features = ["ws", "json", "multipart"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }
base64 = { workspace = true }
urlencoding = "2.1"
# B3 /addLocalBook 文件名解析书名作者（对齐原版 LocalBook.nameAuthorPatterns）
regex = { workspace = true }
# B4 段评 /legacyReviewPage 的 frame-ancestors origin 解析（对齐 java.net.URI
# 校验；与 legado-net 同主版本 2，零新增编译单元）
url = "2"
# B4 legacy 会话/游标 ID（对齐 UUID.randomUUID()；工作区已登记 uuid 1.x）
uuid = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "fs"] }
# 静态资产开发机磁盘兜底（web_assets::serve_static 内以 ServiceExt::oneshot
# 调用 ServeDir）；tower 亦是 axum 的传递依赖与既有 dev-dependency，无新增外部 crate
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
default = []
# 透传 legado-js 的 quickjs feature：启用后 MCP eval_js 工具可真实执行 JS 脚本；
# 同步透传 legado-fetcher/quickjs（书源 JS 分派/loginCheckJs 真执行）
quickjs = ["legado-js/quickjs", "legado-fetcher/quickjs"]

[dev-dependencies]
tokio-tungstenite = "0.26"
futures-util = "0.3"
