[package]
name = "legado-book"
version = "0.2.0"
edition = "2021"

[dependencies]
legado-core = { path = "../legado-core" }
serde = { workspace = true }
serde_json = { workspace = true }
# [批43 | 2026-11-15] 2.4.2 → 9.5.1：修复 RUSTSEC-2026-0367/0368/0369/0429
# （extract() 系列路径穿越与权限位缺陷，patched 范围 >=9.0.0；2.6.1 非修复版本）。
# [P1-1 | zip 9] 必须 default-features = false：9.x 的 default 比 2.4.2 多出
# `ppmd`。PPMd 解码器按条目数据流内的 2 字节参数分配模型内存
# （`1 MiB * (((params >> 4) & 0xFF) + 1)`，上限 256 MiB），且 `LazyDecompressor`
# 把分配推迟到**首次 read**——声明解压后仅 1 字节的恶意条目也能通过我方全部
# 声明限额，首次读取仍瞬时提交最多 256 MiB（移动端 OOM/LMK）。与 7z 的既有
# 决策一致（见下方 sevenz-rust2）剔除；下列 8 项恰为 2.4.2 的 default 集合，
# 零能力回退。
zip = { version = "9", default-features = false, features = [
    "aes-crypto", "bzip2", "deflate64", "deflate", "lzma", "time", "zstd", "xz",
] }
quick-xml = "0.42"
encoding_rs = "0.8"
regex = "1"
# [依赖安全批 | 2026-11-16] 0.42 → 0.47：0.47 用 skrifa（可选 font_embedding
# feature）取代 ttf-parser，清除 RUSTSEC-2026-0192（ttf-parser unmaintained）。
# 默认 features 不含 font_embedding，故不引入 skrifa。
lopdf = "0.47"
# PDF 导出：纯 Rust 实现（printpdf + rusttype），支持 Android 交叉编译
# images feature：启用 genpdf 的图片嵌入能力（图片书/漫画 PDF 导出）
genpdf = { version = "0.2", features = ["images"] }
# 图片解码（JPEG/PNG）：与 genpdf 的 image 0.23 依赖统一版本，仅启用所需格式
image = { version = "0.23", default-features = false, features = ["png", "jpeg"] }

# [批24 | 2026-10-27] 7z 导入（§2.34）：纯 Rust、Apache-2.0，Android/iOS 可交叉编译。
# 必须 default-features=false：0.24 默认 features 会引入 aes256/bzip2/ppmd 等
# 重型可选依赖（且与仓库既有 crypto 版本重复）。仅保留内置 LZMA/LZMA2/COPY/BCJ。
sevenz-rust2 = { version = "0.24", default-features = false }

[dev-dependencies]
# 测试期临时启用 compress（构造 7z 夹具）；不影响 release 产物依赖面。
# 加密包用例使用预生成字节夹具（见 archive.rs 测试常量），不启用 aes256，
# 避免把 aes/cbc/sha2 的重复 crypto 版本带入 Cargo.lock。
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
# 批24d：交错布局 7z 夹具以 base64 内联（测试不依赖宿主 Python/py7zr）
base64 = { workspace = true }

# unrar 在 Android 上无法交叉编译（unrar_sys 含 Windows 专属代码），
# iOS 与 Android 同策略排除（对齐 Android 行为基线，免 C++ 运行时链接）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
unrar = "0.5"
