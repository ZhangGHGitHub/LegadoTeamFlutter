[package]
name = "legado-book"
version = "0.2.0"
edition = "2021"

[dependencies]
legado-core = { path = "../legado-core" }
serde = { workspace = true }
serde_json = { workspace = true }
zip = "2"
quick-xml = "0.37"
encoding_rs = "0.8"
regex = "1"
lopdf = "0.34"

# unrar 在 Android 上无法交叉编译（unrar_sys 包含 Windows 专属代码）
[target.'cfg(not(target_os = "android"))'.dependencies]
unrar = "0.5"
